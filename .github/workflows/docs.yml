name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "docs/**"
      - "README.md"

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Rust documentation
        run: cargo doc --no-deps --all-features
      - name: Validate documentation tree
        run: test -d docs
